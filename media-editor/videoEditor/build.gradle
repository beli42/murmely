import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'org.pixeldroid.media_editor.videoEdit'
    compileSdk = 36

    defaultConfig {
        minSdk = 29
        compileSdk = 36
    }

    buildTypes {
        release {
            minifyEnabled = false
            consumerProguardFiles 'proguard-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        staging {}
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.0')

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.9.4"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation('com.github.bumptech.glide:glide:5.0.5') {
        exclude group: "com.android.support"
    }

    implementation project(path: ':common')


    //Video editor dependencies
    implementation 'androidx.media2:media2-widget:1.3.0'
    implementation 'androidx.media2:media2-player:1.3.0'
    implementation 'com.antonkarpenko:ffmpeg-kit-min-gpl:1.1.0'

}
