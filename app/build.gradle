import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Map for the version code that gives each ABI a value.
ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, x86: 3, x86_64: 4]

// Different version codes per architecture (for F-Droid support):
// 100 * versionCode + ABI code, e.g. 502 for arm64-v8a.
// Uses the androidComponents API; the old applicationVariants API is removed in AGP 9.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }?.identifier
            def abiCode = project.ext.abiCodes.get(abi) ?: 0
            output.versionCode.set(100 * output.versionCode.get() + abiCode)
        }
    }
}

android {
    namespace = 'eu.artectrex.bunny'
    compileSdk = 36

    defaultConfig {
        // Own application id so this build can be installed next to the official Bunny
        applicationId = 'eu.artectrex.bunny.beli'
        minSdk = 29
        targetSdk = 34
        versionCode = 6
        versionName = "5.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Shown on the about page
        resValue "string", "application_id", applicationId
        resValue "string", "versionName", versionName
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        // Configures multiple APKs based on ABI.
        abi {

            // Enables building multiple APKs per ABI.
            enable = true

            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for "x86", "x86_64", "arm64-v8a" and "armeabi-v7a".

            // Resets the list of ABIs for Gradle to create APKs for to none.
            reset()

            // Specifies a list of ABIs for Gradle to create APKs for.
            //noinspection ChromeOsAbiSupport
            include project.ext.abiCodes.keySet() as String[]

            // Specifies that we don't want to also generate a universal APK that includes all ABIs.
            universalApk = false
        }

    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
        // Needed for the resValue entries in defaultConfig
        resValues = true
    }
}
dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.3'

    // Media editor modules, in media-editor/
    implementation project(':common')
    implementation project(':photoEditor')
    implementation project(':videoEditor')
    implementation project(path: ':pixel_common')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
