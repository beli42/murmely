# All versions in one place. Dependabot proposes updates for this file.
# Where modules used different versions of a library, the highest one is used here; Gradle
# already resolved the app to that version before, so the built app does not change.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
aboutlibraries-gradle-plugin = "14.1.0"
aboutlibraries-library = "14.1.0"

androidx-core = "1.19.1"
androidx-appcompat = "1.8.0"
androidx-activity = "1.11.0"
androidx-fragment = "1.9.1"
androidx-constraintlayout = "2.2.2"
androidx-recyclerview = "1.4.0"
androidx-preference = "1.2.1"
androidx-splashscreen = "1.2.0"
androidx-lifecycle = "2.9.4"
androidx-navigation = "2.10.2"
androidx-room = "2.8.5"
material = "1.13.0"
glide = "5.0.9"
# Media3 1.11.1 is built with compileSdk 36 and Kotlin 2.2 (older Kotlin than ours is fine)
media3 = "1.11.1"

# Compose BOM 2026.09.00; libraries built with older Kotlin work with newer Kotlin.
# Update Compose together with Kotlin.
compose-bom = "2026.09.00"

junit = "4.13.2"
# 1.7.0 / Espresso 3.7.0 support Android 16+ (older Espresso fails there)
androidx-test-runner = "1.7.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-espresso = "3.7.0"

[libraries]
# AGP 9 brings Kotlin itself (built-in Kotlin, KGP 2.2.10); this raises it to our Kotlin version
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "androidx-lifecycle" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
material = { module = "com.google.android.material:material", version.ref = "material" }
glide-library = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries-library" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui-main = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling-debug = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }

[bundles]
androidx-lifecycle = [
    "androidx-lifecycle-livedata-ktx", "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-viewmodel-savedstate", "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-common-java8",
]
# Espresso is listed so that its version (3.7.0) wins over older ones pulled in by other libraries
android-instrumented-test = ["androidx-test-runner", "androidx-test-core-ktx", "androidx-test-ext-junit", "androidx-test-espresso-core"]
# Video playback and conversion
media3 = ["media3-common", "media3-exoplayer", "media3-ui", "media3-transformer", "media3-effect"]
compose = ["compose-ui-main", "compose-ui-tooling-preview", "compose-material3", "compose-material-icons-core",
    "androidx-activity-compose", "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-runtime-compose"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries-gradle-plugin" }
