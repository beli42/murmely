# Tests of the app and the media editor. Only runs when started manually:
# Actions → "Tests" → "Run workflow" (choose the branch, e.g. tuning).
#
# - Lint: static analysis, warnings fail
# - Unit tests: fast JVM tests (file names, collage geometry, slider values, shader compilation,
#   save settings)
# - Integration tests: on an Android emulator; save real images (single photo and collage,
#   PNG and JPG) and check every file for completeness and correctness; app flow, settings and
#   screens. Slower, can be skipped.

name: Tests

on:
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the integration tests on an emulator (slower)
        type: boolean
        default: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper JAR is executed by every build: make sure it is an official Gradle release
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Warnings are errors; findings that already existed are in each module's lint-baseline.xml
      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: "**/build/reports/lint-results-debug.html"
          if-no-files-found: ignore

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper JAR is executed by every build: make sure it is an official Gradle release
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install GLSL validator (for the shader test)
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :photoEditor:testDebugUnitTest :videoEditor:testDebugUnitTest --no-daemon

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            media-editor/photoEditor/build/reports/tests/
            media-editor/videoEditor/build/reports/tests/
          if-no-files-found: ignore

  integration:
    name: Integration tests (emulator)
    if: ${{ inputs.integration }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper JAR is executed by every build: make sure it is an official Gradle release
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebugAndroidTest :photoEditor:assembleDebugAndroidTest :videoEditor:assembleDebugAndroidTest --no-daemon

      - name: Run integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest :photoEditor:connectedDebugAndroidTest :videoEditor:connectedDebugAndroidTest --no-daemon

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-report
          path: |
            app/build/reports/androidTests/
            media-editor/photoEditor/build/reports/androidTests/
            media-editor/videoEditor/build/reports/androidTests/
          if-no-files-found: ignore
