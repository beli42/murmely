# Builds release and debug APKs of Murmely (app and media editor are in this repository).
#
# Start: Actions → "Build APK" → "Run workflow" (branch main, or tuning for work in progress).
# The APKs can be downloaded from the run's summary page under "Artifacts".

name: Build APK

# Only runs when started manually
on:
  workflow_dispatch:

# Starting the same build again cancels the one still running
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository
permissions:
  contents: read

jobs:
  build:
    # Fixed version, so the build machine doesn't change under us (ubuntu-latest moves on)
    runs-on: ubuntu-24.04
    # The release key's secrets are in the environment "release"
    # (Settings → Environments → release → Environment secrets)
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper JAR is executed by every build: make sure it is an official Gradle release
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Release key
        # From the secrets of the environment "release"; without them the release APKs are
        # built unsigned
        env:
          KEYSTORE_BASE64: ${{ secrets.MURMELY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/murmely-release.jks"
            echo "MURMELY_KEYSTORE=$RUNNER_TEMP/murmely-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key in the secrets of the environment release: release APKs are unsigned"
          fi

      - name: Build Murmely
        env:
          MURMELY_KEYSTORE_PASSWORD: ${{ secrets.MURMELY_KEYSTORE_PASSWORD }}
          MURMELY_KEY_ALIAS: ${{ secrets.MURMELY_KEY_ALIAS }}
          MURMELY_KEY_PASSWORD: ${{ secrets.MURMELY_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/murmely-release.jks"

      - name: Name and summary
        id: info
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "name=murmely-${{ github.ref_name }}-$(date -u +%Y-%m-%d)-${SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Murmely build"
            echo
            echo "Branch \`${{ github.ref_name }}\`, commit \`${SHA}\`: $(git log -1 --format=%s)"
            echo
            echo "| APK | Size |"
            echo "|---|---|"
            for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Release: to install and update (signed with the release key; \`-unsigned\` if no key is set up)."
            echo "Debug: for testing only. One APK for all devices (phones and emulator)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.info.outputs.name }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.info.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
