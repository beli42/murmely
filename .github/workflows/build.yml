# Builds debug APKs of Murmely (app and media editor are in this repository).
#
# Start: Actions → "Build APK" → "Run workflow" (branch master, or tuning for work in progress).
# The APKs can be downloaded from the run's summary page under "Artifacts".

name: Build APK

# Only runs when started manually
on:
  workflow_dispatch:

# Starting the same build again cancels the one still running
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository
permissions:
  contents: read

jobs:
  build:
    # Fixed version, so the build machine doesn't change under us (ubuntu-latest moves on)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper JAR is executed by every build: make sure it is an official Gradle release
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Murmely
        run: ./gradlew assembleDebug --no-daemon

      - name: Name and summary
        id: info
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "name=murmely-${{ github.ref_name }}-$(date -u +%Y-%m-%d)-${SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Murmely debug build"
            echo
            echo "Branch \`${{ github.ref_name }}\`, commit \`${SHA}\`: $(git log -1 --format=%s)"
            echo
            echo "| APK | Size |"
            echo "|---|---|"
            for f in app/build/outputs/apk/debug/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Phone: \`arm64-v8a\` · Emulator on a PC: \`x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.info.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
