# Builds debug APKs of Bunny (app and media editor are in this repository).
#
# Start: Actions → "Build APK" → "Run workflow" (branch master, or tuning for work in progress).
# The APKs can be downloaded from the run's summary page under "Artifacts".

name: Build APK

# Only runs when started manually
on:
  workflow_dispatch:

# Starting the same build again cancels the one still running
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Bunny
        run: ./gradlew assembleDebug --no-daemon

      - name: Name and summary
        id: info
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "name=bunny-${{ github.ref_name }}-$(date -u +%Y-%m-%d)-${SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Bunny debug build"
            echo
            echo "Branch \`${{ github.ref_name }}\`, commit \`${SHA}\`: $(git log -1 --format=%s)"
            echo
            echo "| APK | Size |"
            echo "|---|---|"
            for f in app/build/outputs/apk/debug/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Phone: \`arm64-v8a\` · Emulator on a PC: \`x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.info.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
